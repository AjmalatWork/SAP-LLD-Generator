services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sap_lld_step2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lld}
      POSTGRES_DB: ${POSTGRES_DB:-sap_lld}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lld} -d ${POSTGRES_DB:-sap_lld}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
